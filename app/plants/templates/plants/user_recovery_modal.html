<!-- /app/plants/templates/plants/user_recovery_modal.html -->

<div class="bnd-modal-container">
  <header class="bnd-modal-header">
    <h3>Password Reset</h3>
  </header>
  <form class="bnd-modal-contents" action="{% url 'plants:user_recovery' %}" method="post">
    {% csrf_token %}
    <div class="bnd-modal-button-bar">
      {{ form.as_p }}
      <button type="submit" class="bnd-button-submit" >Login</button>
      <!-- Cancel login - the page reload clears the modal and keeps the page from hanging -->
      <button onclick="location.reload();" type="button" class="bnd-button-cancel">Cancel</button>
    </div>
  </form>
</div>
