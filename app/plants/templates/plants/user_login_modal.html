<!-- /app/plants/templates/plants/user_login_modal.html -->

<div class="bnd-modal-container">
  <header class="bnd-modal-header">
    <h3>User Login</h3>
  </header>
  <form action="{% url 'plants:user_login' %}" method="post">
    {% csrf_token %}
    <div class="bnd-modal-contents">
      {{ form.username.as_field_group }}
      <div class="bnd-password-container">
        {{ form.password.as_field_group }}
        <span id="id_login_toggle" class="material-icons">visibility_off</span>
      </div>
    </div>
    <div class="bnd-modal-button-bar">
      <button type="submit" class="bnd-button-submit">Login</button>
      <!-- Sign-up modal -->
      <button type    = "button"
              class   = "bnd-button bnd-round-large" 
              onclick = "openUserprofileModal()">
        Sign-up
      </button>
      <button type    = "button"
              class   = "bnd-button bnd-round-large" 
              onclick = "openPwdResetModal()">
        Forgot Password?
      </button>
    </div>
  </form>
</div>
