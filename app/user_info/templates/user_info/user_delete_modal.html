<!-- /app/user_info/templates/user_info/user_delete_modal.html -->
<div class="bnd-modal-container">
    <header class="bnd-modal-header">
        <h4>Delete User?</h4>
    </header>
    <form class="bnd-modal-contents" action="{% url 'user_info:user_delete' user.id %}" method="post">
        {% csrf_token %}
        <p>Username = {{ user.username }}</p>
        <footer class="bnd-modal-button-bar">
            <button type="submit" class="bnd-button-submit">Confirm</button>
            <button type  = "button"
                    id    = "id_user_delete_modal_close"
                    class = "bnd-button-cancel">
                Cancel
            </button>
        </footer>
    </form>
</div>
